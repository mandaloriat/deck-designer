name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version pin here: package.json's packageManager is the single source
      # of truth, and setting both makes the action refuse to start.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Build the example projects
        run: |
          node packages/cli/dist/bin.js build --project examples/starter-deck --json
          node packages/cli/dist/bin.js print-plan --project examples/starter-deck --json
          node packages/cli/dist/bin.js build --project examples/briscola --quiet
          node packages/cli/dist/bin.js print-plan --project examples/briscola --page A4 --margin 6 --json
